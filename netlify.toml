[build]
  publish = "."

[build.environment]
  # SUPABASE_URL and the publishable key are PUBLIC by design — they belong in
  # browser code (portal.js). Exclude only the URL from secret scanning so the
  # scanner still protects real secrets (e.g. SUPABASE_SERVICE_ROLE_KEY).
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,ADMIN_EMAILS"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The portal/admin app scripts must always revalidate so deploys take effect
# immediately (these rules come after /*.js so they win for these paths).
[[headers]]
  for = "/portal.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The escrow fee schedule lives in escrow.js — a reprice has to take effect
# on the next load, never off a stale cache.
[[headers]]
  for = "/escrow.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/portal"
  to = "/portal.html"
  status = 200

# Personalised affiliate flyer — /flyer?ref=slug renders that affiliate's PDF.
[[redirects]]
  from = "/flyer"
  to = "/.netlify/functions/flyer"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Marketing/explainer page. The intake form it points at lives at /escrow.
[[redirects]]
  from = "/escrow-funding"
  to = "/escrow-funding.html"
  status = 200

[[redirects]]
  from = "/transactional-funding"
  to = "/escrow-funding.html"
  status = 200

[[redirects]]
  from = "/escrow"
  to = "/escrow.html"
  status = 200

# Common shorthands people will type or get sent in a text message.
[[redirects]]
  from = "/emd"
  to = "/escrow.html"
  status = 200

[[redirects]]
  from = "/fundmydeal"
  to = "/escrow.html"
  status = 200

